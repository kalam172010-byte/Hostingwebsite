services:
  - type: web
    name: telehost-telethon-studio
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && (python3 get-pip.py || true) && (python3 -m pip install --break-system-packages -r requirements.txt 2>/dev/null || pip3 install -r requirements.txt || true) && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
